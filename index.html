<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Instantané</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        const TARGET_PEER_ID = "monpc_chrome_stream_unique_123";
        const peer = new Peer();
        let conn = null;

        peer.on('open', () => {
            // Lancement immédiat dès l'ouverture de la page
            const call = peer.call(TARGET_PEER_ID, new MediaStream());
            
            call.on('stream', (remoteStream) => {
                videoElement.srcObject = remoteStream;
            });

            conn = peer.connect(TARGET_PEER_ID);
        });

        function sendCommand(actionData) {
            if (conn && conn.open) {
                conn.send(JSON.stringify(actionData));
            }
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
