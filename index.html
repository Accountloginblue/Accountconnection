<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream & Contrôle - TestWebsocket</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lecteur Twitch (Assurez-vous de remplacer "votre-nom" par votre pseudo GitHub exact si hébergé en ligne) -->
    <div id="video-container">
        <iframe src="https://player.twitch.tv/?channel=testwesocket&parent=votre-nom.github.io&parent=localhost" 
                allowfullscreen="true">
        </iframe>
    </div>

    <!-- Calque d'interaction transparent -->
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // Connexion WebSocket native vers le broker MQTT public
        // Le port 8000 est le port WebSocket standard pour HiveMQ
        const ws = new WebSocket('wss://broker.hivemq.com:8000/mqtt', ['mqttv3.1']);
        let isConnected = false;

        ws.onopen = () => {
            console.log("Connecté au broker MQTT via WebSocket natif !");
            // Envoi du paquet de connexion MQTT (CONNECT)
            const connectPacket = new Uint8Array([
                0x10, 0x0c, 0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c, 0x00, 0x00
            ]);
            ws.send(connectPacket);
            isConnected = true;
        };

        ws.onerror = (err) => {
            console.error("Erreur WebSocket MQTT :", err);
        };

        ws.onclose = () => {
            console.log("Déconnecté du broker MQTT.");
            isConnected = false;
        };

        // Fonction d'envoi de message MQTT au format PUBLISH
        function sendCommand(actionData) {
            if (!isConnected) return;

            const topic = "monpc/chrome/commandes";
            const payload = JSON.stringify(actionData);

            // Construction manuelle d'un paquet PUBLISH MQTT léger
            const topicBytes = new TextEncoder().encode(topic);
            const payloadBytes = new TextEncoder().encode(payload);
            
            const remainingLength = 2 + topicBytes.length + payloadBytes.length;
            
            let header = [0x30, remainingLength]; // 0x30 = PUBLISH QoS 0
            let packet = new Uint8Array(header.length + 2 + topicBytes.length + payloadBytes.length);
            
            packet.set(header, 0);
            packet[2] = (topicBytes.length >> 8) & 0xFF;
            packet[3] = topicBytes.length & 0xFF;
            packet.set(topicBytes, 4);
            packet.set(payloadBytes, 4 + topicBytes.length);

            ws.send(packet);
        }

        // Clics de souris convertis en pourcentage
        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            const xPercent = (e.clientX - rect.left) / rect.width;
            const yPercent = (e.clientY - rect.top) / rect.height;

            sendCommand({ action: 'click', x: xPercent, y: yPercent });
        });

        // Molette (Scroll haut / bas)
        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        // Clavier complet
        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
