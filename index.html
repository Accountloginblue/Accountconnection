<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Direct & Contrôle</title>
    <!-- Inclusion de la bibliothèque PeerJS officielle -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Initialisation PeerJS...</div>
    <video id="remote-video" autoplay playsinline></video>
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        const TARGET_PEER_ID = "monpc_chrome_stream_unique_123";

        // Initialisation de PeerJS sur le cloud public gratuit
        const peer = new Peer();
        let conn = null;
        let pc = null;

        peer.on('open', (id) => {
            statusDiv.innerText = "Connecté à PeerJS. Connexion au PC...";
            connectToPC();
        });

        peer.on('error', (err) => {
            console.error("Erreur PeerJS:", err);
            statusDiv.innerText = "Erreur de connexion P2P";
        });

        function connectToPC() {
            // Création d'une connexion WebRTC avec le PC cible
            const call = peer.call(TARGET_PEER_ID, new MediaStream()); // Signal d'appel vidéo
            
            // Établissement du DataChannel pour envoyer les clics/clavier instantanément
            conn = peer.connect(TARGET_PEER_ID);

            conn.on('open', () => {
                statusDiv.innerText = "Canal de contrôle établi !";
            });

            // Réception du flux vidéo du PC
            call.on('stream', (remoteStream) => {
                videoElement.srcObject = remoteStream;
                statusDiv.style.display = 'none';
            });
        }

        // --- Envoi des commandes (Souris / Clavier) via le canal P2P direct ---
        function sendCommand(actionData) {
            if (conn && conn.open) {
                conn.send(JSON.stringify(actionData));
            }
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
