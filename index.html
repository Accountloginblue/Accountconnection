<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream & Contrôle - TestWebsocket</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #twitch-embed {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        /* Écran de démarrage pour forcer l'activation du son/vidéo par le navigateur */
        #play-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
        #play-button {
            padding: 15px 30px;
            font-size: 20px;
            background: #9146FF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
            display: none; /* Activé après le clic de lancement */
        }
    </style>
</head>
<body>

    <div id="twitch-embed"></div>

    <!-- Écran de verrouillage initial requis par les navigateurs pour lancer le flux -->
    <div id="play-overlay">
        <h2>Flux prêt pour TestWebsocket</h2>
        <p>Cliquez pour lancer le stream et activer le contrôle distant</p>
        <button id="play-button">Lancer le Stream</button>
    </div>

    <div id="input-overlay" tabindex="0"></div>

    <script>
        const options = {
            width: "100%",
            height: "100%",
            channel: "testwesocket",
            parent: ["accountloginblue.github.io", "localhost"],
            autoplay: true,
            muted: true // Muet par défaut pour respecter les règles d'autoplay du navigateur
        };
        const player = new Twitch.Player("twitch-embed", options);

        const playOverlay = document.getElementById('play-overlay');
        const playButton = document.getElementById('play-button');
        const inputOverlay = document.getElementById('input-overlay');

        // Au clic sur le bouton, on active le son, on masque l'écran de démarrage et on active le contrôle
        playButton.addEventListener('click', () => {
            player.setMuted(false);
            player.play();
            playOverlay.style.display = 'none';
            inputOverlay.style.display = 'block';
            inputOverlay.focus();
        });

        // Connexion MQTT WebSocket natif
        const ws = new WebSocket('wss://broker.hivemq.com:8000/mqtt', ['mqttv3.1']);
        let isConnected = false;

        ws.onopen = () => {
            console.log("Connecté au broker MQTT !");
            const connectPacket = new Uint8Array([
                0x10, 0x0c, 0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c, 0x00, 0x00
            ]);
            ws.send(connectPacket);
            isConnected = true;
        };

        function sendCommand(actionData) {
            if (!isConnected) return;
            const topic = "monpc/chrome/commandes";
            const payload = JSON.stringify(actionData);

            const topicBytes = new TextEncoder().encode(topic);
            const payloadBytes = new TextEncoder().encode(payload);
            const remainingLength = 2 + topicBytes.length + payloadBytes.length;
            
            let header = [0x30, remainingLength];
            let packet = new Uint8Array(header.length + 2 + topicBytes.length + payloadBytes.length);
            
            packet.set(header, 0);
            packet[2] = (topicBytes.length >> 8) & 0xFF;
            packet[3] = topicBytes.length & 0xFF;
            packet.set(topicBytes, 4);
            packet.set(payloadBytes, 4 + topicBytes.length);

            ws.send(packet);
        }

        inputOverlay.addEventListener('click', (e) => {
            const rect = inputOverlay.getBoundingClientRect();
            const xPercent = (e.clientX - rect.left) / rect.width;
            const yPercent = (e.clientY - rect.top) / rect.height;
            sendCommand({ action: 'click', x: xPercent, y: yPercent });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
