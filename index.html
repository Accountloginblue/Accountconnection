<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream & Contrôle - TestWebsocket</title>
    <!-- Utilisation d'un CDN MQTT plus robuste et compatible -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.37.0/mqtt.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lecteur Twitch configuré avec le bon domaine parent -->
    <div id="video-container">
        <iframe src="https://player.twitch.tv/?channel=testwesocket&parent=github.io" 
                allowfullscreen="true">
        </iframe>
    </div>

    <!-- Calque d'interaction -->
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // Connexion MQTT via WebSocket sécurisé (WSS) avec la bibliothèque moderne
        const clientId = "web_control_" + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
            clientId: clientId
        });

        client.on('connect', () => {
            console.log("Connecté au broker MQTT avec succès !");
        });

        client.on('error', (err) => {
            console.error("Erreur MQTT :", err);
        });

        // Fonction d'envoi d'ordre
        function sendCommand(actionData) {
            if (!client.connected) return;
            client.publish("monpc/chrome/commandes", JSON.stringify(actionData));
        }

        // Clics de souris
        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            const xPercent = (e.clientX - rect.left) / rect.width;
            const yPercent = (e.clientY - rect.top) / rect.height;

            sendCommand({ action: 'click', x: xPercent, y: yPercent });
        });

        // Molette (Scroll)
        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        // Clavier
        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
