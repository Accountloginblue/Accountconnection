<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bureau Virtuel Cloud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw; height: 100vh;
            background: #000; overflow: hidden;
            cursor: none; /* Masque le curseur pour une immersion totale */
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain; background: #000;
        }
        #welcome-screen {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0f0f19; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; z-index: 10000; font-family: system-ui, sans-serif;
            cursor: default; transition: opacity 0.4s ease;
        }
        .btn-launch {
            background: #6366f1; color: white; border: none;
            padding: 16px 32px; border-radius: 8px; cursor: pointer;
            font-size: 18px; font-weight: bold;
        }
        .btn-launch:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1 style="margin-bottom: 15px;">Connexion au Bureau Cloud</h1>
        <button class="btn-launch" id="start-btn">Démarrer le flux</button>
        <p style="margin-top: 15px; font-size: 13px; color: #888;">Ctrl + Shift + Q pour afficher le menu</p>
    </div>

    <video id="remote-video" autoplay playsinline></video>

    <script>
        const video = document.getElementById('remote-video');
        const welcomeScreen = document.getElementById('welcome-screen');
        const startBtn = document.getElementById('start-btn');

        // URL de votre script Python exposée via ngrok
        const CONTROL_URL = "https://xxxx-xxxx.ngrok-free.app/control";

        function sendAction(data) {
            if (welcomeScreen.style.display !== 'none') return;
            fetch(CONTROL_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error("Erreur de transmission :", err));
        }

        startBtn.addEventListener('click', async () => {
            try {
                // Connexion au flux WebRTC du serveur relais cloud
                const pc = new RTCPeerConnection();
                pc.ontrack = (event) => {
                    video.srcObject = event.streams[0];
                };
                
                // Simulation / Connexion au flux distant (via l'offre WebRTC du serveur relais)
                // Note : Vous pouvez aussi utiliser une balise source standard si le relais fournit du HLS/WebRTC direct.
                
                welcomeScreen.style.opacity = '0';
                setTimeout(() => welcomeScreen.style.display = 'none', 400);
            } catch (err) {
                console.error("Erreur de lecture du flux :", err);
            }
        });

        // Commandes Clavier & Souris
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'q') {
                welcomeScreen.style.display = 'flex';
                welcomeScreen.style.opacity = '1';
                document.body.style.cursor = 'default';
                e.preventDefault();
                return;
            }
            sendAction({ action: "keydown", key: mapKey(e.key) });
            e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            sendAction({ action: "keyup", key: mapKey(e.key) });
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            sendAction({ action: "mousemove", x, y });
        });

        window.addEventListener('mousedown', (e) => {
            const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };
            sendAction({ action: "mousedown", button: btnMap[e.button] || 'left' });
            e.preventDefault();
        });

        window.addEventListener('mouseup', (e) => {
            const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };
            sendAction({ action: "mouseup", button: btnMap[e.button] || 'left' });
            e.preventDefault();
        });

        window.addEventListener('wheel', (e) => {
            sendAction({ action: "wheel", deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('contextmenu', (e) => {
            if (welcomeScreen.style.display === 'none') e.preventDefault();
        });

        function mapKey(key) {
            const map = {
                "Control": "ctrl", "Shift": "shift", "Alt": "alt",
                "ArrowUp": "up", "ArrowDown": "down", "ArrowLeft": "left", "ArrowRight": "right",
                "Enter": "enter", "Backspace": "backspace", "Escape": "esc", " ": "space"
            };
            return map[key] || key.toLowerCase();
        }
    </script>
</body>
</html>
