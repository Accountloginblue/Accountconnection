<video id="remote-video" autoplay playsinline controls></video>

<script>
  // WHEP client minimaliste pour lire le flux MediaMTX
  async function startStream() {
    const video = document.getElementById('remote-video');
    const pc = new RTCPeerConnection();

    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.ontrack = (event) => {
      video.srcObject = event.streams[0];
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // URL de votre serveur MediaMTX (ex: hébergé sur un VPS gratuit ou Fly.io/Render)
    const response = await fetch('https://votre-serveur-mediamtx.com/mystream/whep', {
      method: 'POST',
      body: offer.sdp,
      headers: { 'Content-Type': 'application/sdp' }
    });

    const answerSdp = await response.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  }

  startStream();
</script>
