<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Direct & Contrôle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="status">Connexion P2P en cours...</div>
    <video id="remote-video" autoplay playsinline></video>
    <div id="input-overlay" tabindex="0"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.37.0/mqtt.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // 1. Connexion MQTT pour le signalement et les commandes
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        let pc = null;

        mqttClient.on('connect', () => {
            statusDiv.innerText = "Connecté au broker. Initialisation WebRTC...";
            startWebRTC();
        });

        async function startWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = (event) => {
                videoElement.srcObject = event.streams[0];
                statusDiv.style.display = 'none'; // Cache le statut une fois la vidéo reçue
            };

            // Création de l'offre WebRTC
            const offer = await pc.createOffer({
                offerToReceiveVideo: true,
                offerToReceiveAudio: false
            });
            await pc.setLocalDescription(offer);

            // Envoi de l'offre au PC via MQTT
            mqttClient.publish("monpc/webrtc/signal", JSON.stringify({
                type: offer.type,
                sdp: offer.sdp
            }));

            // Écoute de la réponse (Answer) du PC via MQTT
            mqttClient.subscribe("monpc/webrtc/signal");
            mqttClient.on('message', async (topic, payload) => {
                if (topic === "monpc/webrtc/signal") {
                    const data = JSON.parse(payload.toString());
                    if (data.type === "answer" && pc.signalingState === "have-local-offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        statusDiv.innerText = "Flux P2P actif !";
                    }
                }
            });
        }

        // 2. Envoi des commandes (Souris / Clavier) vers le PC via MQTT
        function sendCommand(actionData) {
            mqttClient.publish("monpc/chrome/commandes", JSON.stringify(actionData));
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
