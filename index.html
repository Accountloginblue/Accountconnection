<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Direct & Contrôle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Connexion au tunnel...</div>
    <video id="remote-video" autoplay playsinline></video>
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // 💡 REMplacez "votre-url-ngrok.ngrok-free.app" par l'URL générée par ngrok (SANS "https://")
        const NGORK_URL = "votre-url-ngrok.ngrok-free.app";
        const ws = new WebSocket(`wss://${NGORK_URL}`);
        
        let pc = null;

        ws.onopen = () => {
            statusDiv.innerText = "Connecté ! Initialisation WebRTC...";
            startWebRTC();
        };

        ws.onerror = (err) => {
            console.error("Erreur WebSocket :", err);
            statusDiv.innerText = "Erreur de connexion au tunnel ngrok";
        };

        async function startWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = (event) => {
                videoElement.srcObject = event.streams[0];
                statusDiv.style.display = 'none'; // Masque le statut une fois la vidéo reçue
            };

            const offer = await pc.createOffer({
                offerToReceiveVideo: true,
                offerToReceiveAudio: false
            });
            await pc.setLocalDescription(offer);

            // Envoi de l'offre WebRTC au script Python via le WebSocket ngrok
            ws.send(JSON.stringify({
                type: offer.type,
                sdp: offer.sdp
            }));
        }

        // Réception de la réponse (Answer) du script Python
        ws.onmessage = async (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === "answer" && pc && pc.signalingState === "have-local-offer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    statusDiv.innerText = "Flux P2P actif !";
                    setTimeout(() => statusDiv.style.display = 'none', 1000);
                }
            } catch (e) {
                console.error("Erreur de traitement du message :", e);
            }
        };

        // --- Envoi des commandes (Souris / Clavier) vers le PC ---
        function sendCommand(actionData) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(actionData));
            }
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
