<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Direct & Contrôle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Remplissage total pour que les pourcentages de clics collent parfaitement */
            object-fit: fill; 
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.75);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Connexion au tunnel ngrok en cours...</div>
    <video id="remote-video" autoplay playsinline muted></video>
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        
        overlay.focus();
        document.addEventListener('click', () => {
            overlay.focus();
            if (videoElement.muted) videoElement.muted = false;
        });

        const NGROK_DOMAIN = "trusting-irritate-pout.ngrok-free.dev";

        let ws = null;
        let pc = null;

        function connectWebSocket() {
            const wsUrl = `wss://${NGROK_DOMAIN}/?ngrok-skip-browser-warning=true`;
            
            statusDiv.innerText = "Ouverture du WebSocket ngrok...";
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDiv.innerText = "Tunnel ngrok connecté ! Initialisation WebRTC...";
                startWebRTC();
            };

            ws.onerror = (err) => {
                console.error("Erreur WebSocket ngrok :", err);
                statusDiv.innerText = "Erreur de connexion au tunnel ngrok.";
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "answer" && pc && pc.signalingState === "have-local-offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        statusDiv.innerText = "Flux P2P actif !";
                    }
                } catch (e) {
                    console.error("Erreur décodage message :", e);
                }
            };
        }

        async function startWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = (event) => {
                console.log("Flux vidéo reçu !");
                videoElement.srcObject = event.streams[0];
                statusDiv.style.display = 'none';
            };

            // Ajout d'un transmetteur vidéo pour forcer la réception du flux
            pc.addTransceiver('video', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: offer.type,
                sdp: offer.sdp
            }));
        }

        function sendCommand(actionData) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(actionData));
            }
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });

        connectWebSocket();
    </script>
</body>
</html>
