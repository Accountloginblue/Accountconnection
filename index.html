<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream P2P Direct & Contrôle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.37.0/mqtt.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remote-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Connexion au broker de secours...</div>
    <video id="remote-video" autoplay playsinline></video>
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // Utilisation du broker Mosquitto via WebSocket sécurisé (très stable pour GitHub Pages)
        const clientId = "web_client_" + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect('wss://test.mosquitto.org:8081/mqtt', {
            clientId: clientId
        });

        let pc = null;

        client.on('connect', () => {
            statusDiv.innerText = "Connecté ! Établissement du flux P2P...";
            client.subscribe("monpc/webrtc/signal", (err) => {
                if (!err) {
                    startWebRTC();
                }
            });
        });

        client.on('error', (err) => {
            console.error("Erreur MQTT :", err);
            statusDiv.innerText = "Erreur de connexion WebSocket (Vérifiez la console)";
        });

        client.on('message', async (topic, payload) => {
            if (topic === "monpc/webrtc/signal") {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.type === "answer" && pc && pc.signalingState === "have-local-offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        statusDiv.innerText = "Flux P2P actif !";
                        setTimeout(() => statusDiv.style.display = 'none', 1500);
                    }
                } catch (e) {
                    console.error("Erreur traitement signal :", e);
                }
            }
        });

        async function startWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = (event) => {
                videoElement.srcObject = event.streams[0];
                statusDiv.style.display = 'none';
            };

            const offer = await pc.createOffer({
                offerToReceiveVideo: true,
                offerToReceiveAudio: false
            });
            await pc.setLocalDescription(offer);

            client.publish("monpc/webrtc/signal", JSON.stringify({
                type: offer.type,
                sdp: offer.sdp
            }));
        }

        function sendCommand(actionData) {
            if (!client.connected) return;
            client.publish("monpc/chrome/commandes", JSON.stringify(actionData));
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
