<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream & Contrôle HTTP Immersif</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw; height: 100vh;
            background: #000; overflow: hidden;
            cursor: none; /* Masque le curseur pour une immersion totale */
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain; background: #000;
        }
        #ui-overlay {
            position: fixed; top: 20px; left: 20px;
            background: rgba(15, 15, 25, 0.9); border: 1px solid rgba(255,255,255,0.2);
            padding: 20px; border-radius: 8px; color: #fff; z-index: 9999;
            font-family: system-ui, sans-serif; backdrop-filter: blur(10px);
        }
        button {
            background: #6366f1; color: white; border: none;
            padding: 10px 20px; border-radius: 6px; cursor: pointer;
            font-weight: bold; margin-top: 10px; width: 100%;
        }
        button:hover { background: #4f46e5; }
        .status { font-size: 12px; margin-top: 8px; color: #10b981; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>

    <div id="ui-overlay">
        <h3>Contrôle Distant (HTTP)</h3>
        <p style="font-size:12px; color:#aaa; margin-top:4px;">Ctrl + Shift + Q pour afficher/masquer</p>
        <button id="start-btn">1. Démarrer le flux vidéo (OBS / Écran)</button>
        <div id="http-status" class="status">Prêt à envoyer les commandes ✔</div>
    </div>

    <script>
        const video = document.getElementById('remote-video');
        const overlay = document.getElementById('ui-overlay');
        const startBtn = document.getElementById('start-btn');
        const statusEl = document.getElementById('http-status');

        // URL Ngrok configurée avec votre domaine
        const SERVER_URL = "https://trusting-irritate-pout.ngrok-free.dev/control";

        // Fonction centralisée pour envoyer les actions en HTTP POST (fetch)
        function sendAction(data) {
            if (overlay.style.display !== 'none') return;
            
            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {
                console.error("Erreur de transmission HTTP :", err);
            });
        }

        // Démarrage du flux vidéo capturé
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });
                video.srcObject = stream;
                overlay.style.display = 'none';
            } catch (err) {
                console.error("Erreur flux :", err);
            }
        });

        // Menu d'urgence (Ctrl + Shift + Q)
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'q') {
                overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
                document.body.style.cursor = overlay.style.display === 'block' ? 'default' : 'none';
                e.preventDefault();
                return;
            }
            sendAction({ action: "keydown", key: mapKey(e.key) });
            e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            sendAction({ action: "keyup", key: mapKey(e.key) });
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            sendAction({ action: "mousemove", x, y });
        });

        window.addEventListener('mousedown', (e) => {
            const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };
            sendAction({ action: "mousedown", button: btnMap[e.button] || 'left' });
            e.preventDefault();
        });

        window.addEventListener('mouseup', (e) => {
            const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };
            sendAction({ action: "mouseup", button: btnMap[e.button] || 'left' });
            e.preventDefault();
        });

        window.addEventListener('wheel', (e) => {
            sendAction({ action: "wheel", deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('contextmenu', (e) => {
            if (overlay.style.display === 'none') e.preventDefault();
        });

        function mapKey(key) {
            const map = {
                "Control": "ctrl", "Shift": "shift", "Alt": "alt",
                "ArrowUp": "up", "ArrowDown": "down", "ArrowLeft": "left", "ArrowRight": "right",
                "Enter": "enter", "Backspace": "backspace", "Escape": "esc", " ": "space"
            };
            return map[key] || key.toLowerCase();
        }
    </script>
</body>
</html>
