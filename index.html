<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream & Contrôle - TestWebsocket</title>
    <!-- Client MQTT via WebSocket sécurisé (WSS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/eclipse-paho-mqtt/1.1.0/mqttws31.min.js" type="text/javascript"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Lecteur Twitch en plein écran absolu */
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        /* Calque transparent par-dessus la vidéo pour intercepter les interactions */
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lecteur Twitch officiel intégré -->
    <div id="video-container">
        <iframe src="https://player.twitch.tv/?channel=testwesocket&parent=localhost&parent=github.io" 
                allowfullscreen="true">
        </iframe>
    </div>

    <!-- Calque d'interaction pour la souris et le clavier -->
    <div id="input-overlay" tabindex="0"></div>

    <script>
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        // Connexion au broker MQTT public via WebSocket sécurisé (Port 8000)
        const clientId = "web_control_" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, clientId);

        client.connect({
            useSSL: true,
            onSuccess: () => {
                console.log("Connecté au broker MQTT pour le contrôle !");
            },
            onFailure: (err) => {
                console.error("Erreur connexion MQTT :", err.errorMessage);
            }
        });

        // Fonction d'envoi d'ordre via MQTT
        function sendCommand(actionData) {
            if (!client.isConnected()) return;
            const message = new Paho.MQTT.Message(JSON.stringify(actionData));
            message.destinationName = "monpc/chrome/commandes";
            client.send(message);
        }

        // Clics de souris (convertis en pourcentage pour s'adapter à toutes les tailles d'écran)
        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            const xPercent = (e.clientX - rect.left) / rect.width;
            const yPercent = (e.clientY - rect.top) / rect.height;

            sendCommand({ action: 'click', x: xPercent, y: yPercent });
        });

        // Molette (Scroll haut / bas)
        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        // Clavier complet
        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
