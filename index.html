<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream & Contrôle - TestWebsocket</title>
    <!-- Importation du script officiel du lecteur Twitch -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Conteneur vidéo plein écran */
        #twitch-embed {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        /* Calque transparent invisible par-dessus pour intercepter la souris et le clavier */
        #input-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Emplacement où le lecteur Twitch va s'injecter proprement -->
    <div id="twitch-embed"></div>

    <!-- Calque d'interaction -->
    <div id="input-overlay" tabindex="0"></div>

    <script>
        // 1. Initialisation du lecteur Twitch via l'API officielle
        // Cela permet de forcer la lecture automatique (autoplay) et de masquer les éléments superflus.
        const options = {
            width: "100%",
            height: "100%",
            channel: "testwesocket",
            parent: ["accountloginblue.github.io", "localhost"],
            autoplay: true,
            muted: false // Mettez true si le navigateur bloque l'audio au lancement
        };
        const player = new Twitch.Player("twitch-embed", options);

        // Forcer le mode plein écran et masquer l'interface dès que le lecteur est prêt
        player.addEventListener(Twitch.Player.READY, () => {
            player.setMuted(false);
            // Si le navigateur bloque l'autoplay avec le son, Twitch gère un mode muet automatique de secours
        });

        // 2. Gestion du contrôle MQTT via WebSocket natif
        const overlay = document.getElementById('input-overlay');
        overlay.focus();
        document.addEventListener('click', () => overlay.focus());

        const ws = new WebSocket('wss://broker.hivemq.com:8000/mqtt', ['mqttv3.1']);
        let isConnected = false;

        ws.onopen = () => {
            console.log("Connecté au broker MQTT !");
            const connectPacket = new Uint8Array([
                0x10, 0x0c, 0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c, 0x00, 0x00
            ]);
            ws.send(connectPacket);
            isConnected = true;
        };

        function sendCommand(actionData) {
            if (!isConnected) return;
            const topic = "monpc/chrome/commandes";
            const payload = JSON.stringify(actionData);

            const topicBytes = new TextEncoder().encode(topic);
            const payloadBytes = new TextEncoder().encode(payload);
            const remainingLength = 2 + topicBytes.length + payloadBytes.length;
            
            let header = [0x30, remainingLength];
            let packet = new Uint8Array(header.length + 2 + topicBytes.length + payloadBytes.length);
            
            packet.set(header, 0);
            packet[2] = (topicBytes.length >> 8) & 0xFF;
            packet[3] = topicBytes.length & 0xFF;
            packet.set(topicBytes, 4);
            packet.set(payloadBytes, 4 + topicBytes.length);

            ws.send(packet);
        }

        // Transmission des clics, du scroll et du clavier
        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            const xPercent = (e.clientX - rect.left) / rect.width;
            const yPercent = (e.clientY - rect.top) / rect.height;
            sendCommand({ action: 'click', x: xPercent, y: yPercent });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
