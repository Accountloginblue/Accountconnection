<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream Écran & Contrôle Direct</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill; /* Remplit tout l'écran pour aligner parfaitement les clics */
            z-index: 1;
        }
        #status {
            position: absolute;
            top: 10px; left: 10px;
            color: #00ff00;
            font-family: monospace;
            z-index: 3;
            background: rgba(0,0,0,0.75);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Connexion au tunnel ngrok...</div>
    <img id="screen" alt="Flux d'écran distant">

    <script>
        const statusDiv = document.getElementById('status');
        const screenImg = document.getElementById('screen');
        
        // Votre domaine ngrok actuel
        const NGROK_DOMAIN = "trusting-irritate-pout.ngrok-free.dev";
        const wsUrl = `wss://${NGROK_DOMAIN}/?ngrok-skip-browser-warning=true`;

        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            statusDiv.innerText = "Connecté ! Chargement du flux...";
        };

        ws.onerror = (err) => {
            console.error("Erreur WebSocket :", err);
            statusDiv.innerText = "Erreur de connexion au tunnel ngrok.";
        };

        ws.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                if (message.type === "frame") {
                    // Met à jour l'image en direct avec les données reçues
                    screenImg.src = "data:image/jpeg;base64," + message.data;
                    statusDiv.style.display = 'none'; // Masque le texte une fois l'image affichée
                }
            } catch (e) {
                console.error("Erreur de décodage de l'image :", e);
            }
        };

        // --- Envoi des contrôles (Souris / Clavier) vers le PC ---
        function sendCommand(actionData) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(actionData));
            }
        }

        screenImg.addEventListener('click', (e) => {
            const rect = screenImg.getBoundingClientRect();
            sendCommand({
                action: 'click',
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
        });

        window.addEventListener('wheel', (e) => {
            sendCommand({ action: 'scroll', deltaY: e.deltaY });
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || ["Backspace", "Enter", "Space", "Tab"].includes(e.key)) {
                sendCommand({ action: 'keypress', key: e.key });
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
